<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Logga in</title>
</head>

<body>

<nav class="navbar"></nav>

<div class="title-container">
  <h1>PLUGGPLAN</h1> 
  <img src="images/Calendar.png" alt="Brand logo">
</div>

<hr>

<h2>Logga in</h2>

<div class="form-wrapper">
  <div class="login-box">
    <form>

      <div class="input-box">
        <label for="email">Email</label>
        <input type="email" id="email" class="inp" placeholder="Email-adress.." required>
      </div>

      <div class="input-box">
        <label for="password">Lösenord</label>
        <input type="password" id="password" class="inp" placeholder="Ditt lösenord.." required>
      </div>
      

      <button type="submit" class="login-btn">Logga in</button>


      <div class="register-link">
        <p>Har du inte ett konto?<a href="register.html"> Registrera</a></p>
      </div>


    </form>
  </div>
</div>



<script src="Login.js"></script>
  



</body>
</html>
